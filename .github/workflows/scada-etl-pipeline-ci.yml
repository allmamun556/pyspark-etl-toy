name: scada-etl-pipeline CI

# This repo is a monorepo of unrelated projects, so this workflow is scoped
# with `paths:` to only fire on changes under the project directory - and
# every step's working directory is explicitly the project subfolder, since
# GitHub Actions checks out the whole repo, not just this project.
on:
  push:
    branches: ["**"]
    paths:
      - "data_engineer_tasks/scada-etl-pipeline/**"
      - ".github/workflows/scada-etl-pipeline-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "data_engineer_tasks/scada-etl-pipeline/**"
      - ".github/workflows/scada-etl-pipeline-ci.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_engineer_tasks/scada-etl-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data_engineer_tasks/scada-etl-pipeline/requirements.txt

      # apache-airflow drags in ~150 transitive packages and needs its own
      # constraints file to install reliably outside the official image.
      # None of the pytest cases import airflow (they exercise src/
      # directly), so it's excluded here the same way Dockerfile excludes
      # it from the container build. (The DAGs themselves are executed
      # end-to-end in the migrations-and-dbt job below, where Airflow is
      # installed deliberately for that purpose.)
      - name: Install dependencies
        run: |
          grep -v '^apache-airflow==' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check .

      # Coverage scope/threshold live in pyproject.toml's [tool.pytest.ini_options]
      # addopts, not here, so `pytest` behaves identically locally and in CI.
      - name: pytest (with coverage gate)
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee /tmp/pytest_output.txt

      - name: Add coverage summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 20 "coverage: platform" /tmp/pytest_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  migrations-and-dbt:
    name: Alembic migration + dbt build + DAG execution test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match docker-compose.yml: migration 0004 runs `CREATE
        # EXTENSION timescaledb` and create_hypertable(), which a plain
        # postgres image doesn't ship.
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: scada_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: scada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scada_user -d scada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: scada
      POSTGRES_USER: scada_user
      POSTGRES_PASSWORD: ci_password
    defaults:
      run:
        working-directory: data_engineer_tasks/scada-etl-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data_engineer_tasks/scada-etl-pipeline/requirements.txt

      - name: Install pipeline + dbt dependencies
        run: |
          grep -v '^apache-airflow==' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install -r requirements-dbt.txt

      # Validates the actual schema-of-record against a real, empty
      # Postgres - catches migration drift/breakage that pytest (which
      # never touches a live DB) structurally can't.
      - name: Run Alembic migrations against a fresh database
        run: alembic upgrade head

      # Exercises the idempotency claim this project's docs make repeatedly
      # (replaying a load, or two overlapping windows sharing rows,
      # converges instead of duplicating) against a real database, rather
      # than leaving it as an assertion about the ON CONFLICT SQL's design.
      - name: Verify load idempotency under replay and overlapping windows
        run: python scripts/verify_idempotency.py

      # dbt build = run models + tests. Runs against whatever the (empty,
      # freshly migrated) database has, so this mainly validates the SQL
      # compiles and the schema/tests are internally consistent - not that
      # the numbers are meaningful, which needs live pipeline data.
      - name: dbt build (models + tests)
        working-directory: data_engineer_tasks/scada-etl-pipeline/dbt
        run: dbt build --profiles-dir .

      # dbt source freshness needs recent data to actually PASS (rather
      # than just parse), which this job's freshly-migrated, empty database
      # doesn't have - so this intentionally only checks the config is
      # valid and the command runs, via `--select`, not that it passes.
      # The real signal comes from running this against live pipeline data
      # (see docs); wiring that into a schedule is left as a roadmap item.
      - name: dbt source freshness (config validation only)
        working-directory: data_engineer_tasks/scada-etl-pipeline/dbt
        run: dbt source freshness --profiles-dir . || true

      # Generates the static docs site (index.html + manifest/catalog
      # JSON) - an interactive DAG/lineage graph and column-level schema
      # browser, published below to GitHub Pages on pushes to master.
      - name: dbt docs generate
        working-directory: data_engineer_tasks/scada-etl-pipeline/dbt
        run: dbt docs generate --profiles-dir .

      - name: Upload dbt docs site as a Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: data_engineer_tasks/scada-etl-pipeline/dbt/target

      # Airflow gets its own virtualenv rather than installing into the
      # job's shared site-packages: its constraints-pinned transitive deps
      # (e.g. typing_extensions) can conflict with whatever dbt/alembic
      # just installed above - installing it there produced a real
      # `ImportError: cannot import name 'Sentinel' from 'typing_extensions'`
      # in CI, since pip left the already-installed version in place
      # instead of resolving to the one Airflow's constraints want. This
      # mirrors why this repo already runs Airflow in its own Docker image
      # locally instead of sharing one with the dashboard/dbt.
      - name: Install Airflow for DAG execution test (isolated venv)
        run: |
          python -m venv /tmp/airflow_venv
          /tmp/airflow_venv/bin/pip install "apache-airflow==2.10.2" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.2/constraints-${{ env.PYTHON_VERSION }}.txt"
          # DAG files import `from src...`, so the pipeline's own
          # dependencies (psycopg2-binary, pydantic, ...) need to be
          # importable from this venv too - except sqlalchemy, which is
          # deliberately excluded and left at whatever 1.4.x Airflow's own
          # constraints installed. This is the exact same exclusion (and
          # the exact same reason) as Dockerfile's own build: Airflow's
          # ORM models (e.g. TaskInstance) are written against SQLAlchemy
          # 1.4's declarative style and break under 2.0's stricter
          # Annotated Declarative mapping - confirmed locally with the
          # real error before adding this exclusion.
          grep -v '^sqlalchemy==' requirements.ci.txt > requirements.airflow_venv.txt
          /tmp/airflow_venv/bin/pip install -r requirements.airflow_venv.txt

      # Runs the two simulated-fleet DAGs through Airflow's own local test
      # runner, end to end (extract -> transform -> validate -> load ->
      # watermark/audit) against the database just migrated above - this
      # is real task execution, not just DagBag/schema validation, and is
      # what actually catches wiring bugs a unit test can't (e.g. an
      # XCom key mismatch or a broken reference-anchoring lookup).
      #
      # external_data_sources is deliberately NOT run here: its tasks make
      # real HTTP calls to Open-Meteo and NOAA NDBC, and a third-party
      # outage - which has genuinely happened during this project's
      # development (a live Open-Meteo 503) - says nothing about whether
      # this code is correct. CI gates should be deterministic, not
      # dependent on an external service's uptime.
      - name: Run scada_etl_pipeline and solar_etl_pipeline via `airflow dags test`
        env:
          AIRFLOW_HOME: /tmp/airflow_ci_home
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/data_engineer_tasks/scada-etl-pipeline/airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          # SQLite (the lightest metadata DB for a throwaway CI run) only
          # works with SequentialExecutor - LocalExecutor refuses to start
          # against it. Set explicitly rather than relying on Airflow's
          # default, since this bit us locally when testing against a
          # container whose environment happened to set LocalExecutor.
          AIRFLOW__CORE__EXECUTOR: SequentialExecutor
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow_ci_home/airflow.db
        run: |
          export PATH="/tmp/airflow_venv/bin:$PATH"
          airflow db migrate
          TEST_DATE=$(date -I)
          airflow dags test scada_etl_pipeline "$TEST_DATE"
          airflow dags test solar_etl_pipeline "$TEST_DATE"

  docker-build:
    name: Build all Docker images
    runs-on: ubuntu-latest
    # packages: write is only exercised on the push-to-master path below;
    # harmless to grant unconditionally since PR runs never log in to GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Images are only pushed from master, never from PRs (a PR's build
      # should prove the Dockerfile still works, not publish an artifact
      # from unreviewed code). GITHUB_TOKEN is scoped to this repo's own
      # GHCR packages, so no extra secret is needed.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Airflow image
        uses: docker/build-push-action@v6
        with:
          context: data_engineer_tasks/scada-etl-pipeline
          file: data_engineer_tasks/scada-etl-pipeline/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/scada-etl-pipeline-airflow:latest
            ghcr.io/${{ github.repository_owner }}/scada-etl-pipeline-airflow:${{ github.sha }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: data_engineer_tasks/scada-etl-pipeline
          file: data_engineer_tasks/scada-etl-pipeline/Dockerfile.dashboard
          push: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/scada-etl-pipeline-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/scada-etl-pipeline-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Build dbt image
        uses: docker/build-push-action@v6
        with:
          context: data_engineer_tasks/scada-etl-pipeline
          file: data_engineer_tasks/scada-etl-pipeline/Dockerfile.dbt
          push: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/scada-etl-pipeline-dbt:latest
            ghcr.io/${{ github.repository_owner }}/scada-etl-pipeline-dbt:${{ github.sha }}
          cache-from: type=gha,scope=dbt
          cache-to: type=gha,mode=max,scope=dbt

  deploy-dbt-docs:
    name: Publish dbt docs to GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: migrations-and-dbt
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
