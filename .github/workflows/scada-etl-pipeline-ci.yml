name: scada-etl-pipeline CI

# This repo is a monorepo of unrelated projects, so this workflow is scoped
# with `paths:` to only fire on changes under the project directory - and
# every step's working directory is explicitly the project subfolder, since
# GitHub Actions checks out the whole repo, not just this project.
on:
  push:
    branches: ["**"]
    paths:
      - "data_engineer_tasks/scada-etl-pipeline/**"
      - ".github/workflows/scada-etl-pipeline-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "data_engineer_tasks/scada-etl-pipeline/**"
      - ".github/workflows/scada-etl-pipeline-ci.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_engineer_tasks/scada-etl-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data_engineer_tasks/scada-etl-pipeline/requirements.txt

      # apache-airflow drags in ~150 transitive packages and needs its own
      # constraints file to install reliably outside the official image.
      # None of the 42 pytest cases import airflow (they exercise src/
      # directly), so it's excluded here the same way Dockerfile excludes
      # it from the container build.
      - name: Install dependencies
        run: |
          grep -v '^apache-airflow==' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: pytest
        run: pytest -v

  migrations-and-dbt:
    name: Alembic migration + dbt build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scada_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: scada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scada_user -d scada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: scada
      POSTGRES_USER: scada_user
      POSTGRES_PASSWORD: ci_password
    defaults:
      run:
        working-directory: data_engineer_tasks/scada-etl-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data_engineer_tasks/scada-etl-pipeline/requirements.txt

      - name: Install pipeline + dbt dependencies
        run: |
          grep -v '^apache-airflow==' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
          pip install -r requirements-dbt.txt

      # Validates the actual schema-of-record against a real, empty
      # Postgres - catches migration drift/breakage that pytest (which
      # never touches a live DB) structurally can't.
      - name: Run Alembic migrations against a fresh database
        run: alembic upgrade head

      # dbt build = run models + tests. Runs against whatever the (empty,
      # freshly migrated) database has, so this mainly validates the SQL
      # compiles and the schema/tests are internally consistent - not that
      # the numbers are meaningful, which needs live pipeline data.
      - name: dbt build (models + tests)
        working-directory: data_engineer_tasks/scada-etl-pipeline/dbt
        run: dbt build --profiles-dir .

  docker-build:
    name: Build all Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Airflow image
        uses: docker/build-push-action@v6
        with:
          context: data_engineer_tasks/scada-etl-pipeline
          file: data_engineer_tasks/scada-etl-pipeline/Dockerfile
          push: false
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: data_engineer_tasks/scada-etl-pipeline
          file: data_engineer_tasks/scada-etl-pipeline/Dockerfile.dashboard
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Build dbt image
        uses: docker/build-push-action@v6
        with:
          context: data_engineer_tasks/scada-etl-pipeline
          file: data_engineer_tasks/scada-etl-pipeline/Dockerfile.dbt
          push: false
          cache-from: type=gha,scope=dbt
          cache-to: type=gha,mode=max,scope=dbt
