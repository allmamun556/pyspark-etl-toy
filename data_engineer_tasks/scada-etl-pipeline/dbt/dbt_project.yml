name: "scada_analytics"
version: "1.0.0"
config-version: 2

profile: "scada_analytics"

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Rated capacity for the simulated fleets - mirrors RATED_POWER_KW in
# scada_simulator.py and solar_capacity_kwp in src/config.py. Kept as vars
# (not hardcoded per-model) so they only need updating in one place if a
# fleet's spec changes.
vars:
  rated_power_kw: 3300
  solar_capacity_kwp: 5000

models:
  scada_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
