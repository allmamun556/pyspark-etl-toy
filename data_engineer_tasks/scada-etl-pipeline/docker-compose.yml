x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow_meta
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # App settings consumed by src/config.py inside the pipeline code
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    TURBINE_COUNT: ${TURBINE_COUNT:-20}
    READING_INTERVAL_SECONDS: ${READING_INTERVAL_SECONDS:-600}
    LOAD_BATCH_SIZE: ${LOAD_BATCH_SIZE:-5000}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    # TimescaleDB's image is a drop-in-compatible build on top of the same
    # PostgreSQL 16 (same data directory format, same wire protocol) with
    # the timescaledb extension pre-installed - not a different database.
    # See migrations/versions/0004_timescaledb_hypertables.py.
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      # Overridable via POSTGRES_HOST_PORT in .env if 5432 is already taken
      # on your machine - internal container-to-container traffic always
      # uses 5432 regardless of this mapping.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database for Airflow's own metadata, kept isolated from the
  # application's scada schema.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        until pg_isready -h postgres -U ${POSTGRES_USER}; do sleep 1; done
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc \
          "SELECT 1 FROM pg_database WHERE datname = 'airflow_meta'" | grep -q 1 || \
          PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "CREATE DATABASE airflow_meta"
        airflow db migrate
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} \
          --firstname Data --lastname Engineer --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

  # Runs `dbt build` (models + tests) once against whatever the pipeline has
  # loaded so far, then exits - same one-shot pattern as airflow-init. Rerun
  # on demand with: docker compose run --rm dbt build --profiles-dir .
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "3000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # /api/turbines/stats and /api/solar/plants/stats read from dbt's
      # marts schema now instead of duplicating that aggregation SQL - so
      # the dashboard has a real dependency on dbt having built at least
      # once, not just on Postgres being reachable.
      dbt:
        condition: service_completed_successfully

volumes:
  pg_data:
  airflow_logs:
